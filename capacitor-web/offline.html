<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6bff" />
    <title>SPEAK AI · 연결 오류</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
        background: #336fff;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100dvh;
        place-content: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 15px;
        opacity: 0.82;
      }

      button {
        width: 100%;
        min-width: 220px;
        height: 52px;
        margin-top: 18px;
        border: 0;
        border-radius: 999px;
        background: #ffffff;
        color: #1f2937;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SPEAK AI</h1>
      <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="window.location.reload()">
        다시 시도
      </button>
    </main>
  </body>
</html>
